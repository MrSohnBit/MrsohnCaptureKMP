name: Build Windows Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 17
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e30256717cf8f83e7
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: git update-index --chmod=+x gradlew
        shell: bash

      - name: Build Windows MSI
        run: ./gradlew.bat :app:packageDistributionForCurrentOS

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: MrSohnCapture-Windows-MSI
          path: app/build/compose/binaries/main/msi/*.msi

      - name: Build Windows Distributable (Zip)
        run: ./gradlew.bat :app:createDistributable

      - name: Upload Distributable Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: MrSohnCapture-Windows-Dist
          path: app/build/compose/binaries/main/app/**/*
