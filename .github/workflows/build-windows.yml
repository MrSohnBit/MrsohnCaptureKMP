name: Build Windows Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: git update-index --chmod=+x gradlew
        shell: bash

      - name: Build Windows MSI
        run: ./gradlew :app:packageDistributionForCurrentOS

      - name: Build Windows Distributable
        run: ./gradlew :app:createDistributable

      - name: Zip Distributable (for Release)
        shell: pwsh
        run: |
          Compress-Archive -Path "app/build/compose/binaries/main/app/*" -DestinationPath "MrSohnCapture-Windows.zip"

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrSohnCapture-Windows-MSI
          path: app/build/compose/binaries/main/msi/*.msi

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrSohnCaptureKMP-Windows-Zip
          path: MrSohnCaptureKMP-Windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            app/build/compose/binaries/main/msi/*.msi
            MrSohnCapture-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
