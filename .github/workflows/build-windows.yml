name: Build Windows Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  release-windows:
    runs-on: windows-latest # 윈도우 패키징을 위해 필수 사양

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # KMP 데스크톱 빌드에 적합한 배포판
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # KMP 데스크톱 내장 플러그인으로 MSI 파일 빌드
      - name: Build MSI Package
        run: ./gradlew :app:packageMsi # 모듈명이 다를 경우 수정 (예: :composeApp:packageMsi)

      # 생성된 MSI 파일 확인 및 경로 고정을 위한 업로드 전처리 (선택 사항)
      - name: Check Artifact
        shell: bash
        run: |
          ls -R build/compose/binaries/main/msi/

      - name: Create GitHub Release and Upload MSI
        uses: softprops/action-gh-release@v2
        with:
          # 패키징 결과물 위치 (일반적으로 build/compose/binaries/main/msi/ 폴더 아래에 생성됨)
          files: |
            **/build/compose/binaries/main/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

