name: Build Windows Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: git update-index --chmod=+x gradlew
        shell: bash

      - name: Build Windows MSI
        run: ./gradlew.bat :app:packageDistributionForCurrentOS

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrSohnCapture-Windows-MSI
          path: app/build/compose/binaries/main/msi/*.msi

      - name: Build Windows Distributable (Zip)
        run: ./gradlew.bat :app:createDistributable

      - name: Upload Distributable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrSohnCapture-Windows-Dist
          path: app/build/compose/binaries/main/app/**/*
